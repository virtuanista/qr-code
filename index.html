<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Generador QR - Personalizable</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>
  <main class="app">
    <h1>Generador QR personalizable</h1>

    <section class="controls">
      <label>Texto o URL
        <input id="data" type="text" placeholder="https://ejemplo.com" value="https://example.com">
      </label>

      <label>Tamaño (px)
        <input id="size" type="number" min="64" max="2048" value="300">
      </label>

      <label>Color puntos
        <input id="dotColor" type="color" value="#000000">
      </label>

      <label>Fondo
        <input id="bgColor" type="color" value="#ffffff">
      </label>

      <label>Forma de puntos
        <select id="dotType">
          <option value="square">Cuadrado</option>
          <option value="rounded">Redondeado</option>
          <option value="dots">Puntos</option>
        </select>
      </label>

      <label>Corrección de errores
        <select id="errorLevel">
          <option value="L">L - Hasta 7% (baja)</option>
          <option value="M" selected>M - Hasta 15% (media)</option>
          <option value="Q">Q - Hasta 25% (alta)</option>
          <option value="H">H - Hasta 30% (máxima)</option>
        </select>
      </label>

      <label>Logo (opcional)
        <input id="logoFile" type="file" accept="image/*">
      </label>

      <div class="buttons">
        <button id="generate">Generar</button>
        <button id="downloadPng">Descargar PNG</button>
        <button id="downloadSvg">Descargar SVG</button>
      </div>
    </section>

    <section class="preview">
      <div id="qr-wrap">
        <div id="qr-code"></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
<script>
// Español por defecto; ?lang=en muestra la página en inglés.
const EN = {
 "Generador QR - Personalizable": "QR generator",
 "Generador QR personalizable": "Custom QR generator",
 "Texto o URL": "Text or URL",
 "Tamaño (px)": "Size (px)",
 "Color puntos": "Dot colour",
 "Fondo": "Background",
 "Forma de puntos": "Dot shape",
 "Cuadrado": "Square",
 "Redondeado": "Rounded",
 "Puntos": "Dots",
 "Corrección de errores": "Error correction",
 "L - Hasta 7% (baja)": "L - Up to 7% (low)",
 "M - Hasta 15% (media)": "M - Up to 15% (medium)",
 "Q - Hasta 25% (alta)": "Q - Up to 25% (high)",
 "H - Hasta 30% (máxima)": "H - Up to 30% (highest)",
 "Logo (opcional)": "Logo (optional)",
 "Generar": "Generate",
 "Descargar PNG": "Download PNG",
 "Descargar SVG": "Download SVG",
 "https://ejemplo.com": "https://example.com"
};
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es', tr = s => LANG === 'en' ? EN[s] ?? s : s;
if (LANG === 'en') {
  document.documentElement.lang = 'en'; document.title = tr(document.title);
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; n = w.nextNode();) { const k = n.data.replace(/\s+/g, ' ').trim(); if (EN[k]) n.data = n.data.replace(/^(\s*)[\s\S]*?(\s*)$/, (_, a, b) => a + EN[k] + b); }
  for (const el of document.querySelectorAll('[aria-label],[title],[alt],[placeholder]')) for (const a of ['aria-label', 'title', 'alt', 'placeholder']) if (EN[el.getAttribute(a)]) el.setAttribute(a, EN[el.getAttribute(a)]);
}
{ const b = document.createElement('p'); b.style.cssText = 'max-width:980px;margin:16px auto;text-align:center;font-size:14px';
  b.innerHTML = LANG === 'en' ? '<a href="?lang=es" lang="es">Español</a> · <b>English</b>' : '<b>Español</b> · <a href="?lang=en" lang="en">English</a>';
  b.querySelector('a').style.color = 'inherit'; (document.querySelector('[data-lang]') ?? document.body).append(b);
  b.querySelector('a').addEventListener('click', e => { e.currentTarget.href = e.currentTarget.getAttribute('href').split('#')[0] + location.hash; }); }
</script>
</body>
</html>
